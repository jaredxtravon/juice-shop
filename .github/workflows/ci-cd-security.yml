name: Secure CI/CD Pipeline for OWASP Juice Shop

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for SonarCloud to analyze git history

      # Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install dependencies
      - name: Install dependencies
        run: npm install

      # Fix known dependency vulnerabilities
      - name: Fix dependency vulnerabilities
        run: npm audit fix || echo "Some vulnerabilities could not be fixed automatically"

      # Run SonarCloud SAST scan
      - name: Run SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=jaredxtravon_juice-shop
            -Dsonar.organization=jaredxtravon
            -Dsonar.exclusions=frontend/dist/**,test/**,dist/**
            -Dsonar.sources=routes,lib,frontend/src
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        continue-on-error: true

      # Fetch SonarCloud issues as JSON
      - name: Fetch SonarCloud Issues
        run: |
          curl -u ${{ secrets.SONAR_TOKEN }}: \
            "https://sonarcloud.io/api/issues/search?projectKeys=jaredxtravon_juice-shop&statuses=OPEN,CONFIRMED&ps=500" \
            > sonar-report.json
        continue-on-error: true

      # Build Juice Shop Docker image
      - name: Build Docker image
        run: docker build -t juice-shop:${{ github.sha }} .

      # Run Juice Shop container
      - name: Run Juice Shop container
        run: |
          docker run -d --name juice-shop -p 3000:3000 juice-shop:${{ github.sha }}
          for i in {1..3}; do curl -f http://localhost:3000 && break || sleep 15; done
          curl -f http://localhost:3000 || exit 1

      # Prepare ZAP work directory
      - name: Prepare ZAP working directory
        run: |
          mkdir -p zap-wrk
          chmod -R 777 zap-wrk

      # Run OWASP ZAP DAST scan
      - name: Run OWASP ZAP DAST scan
        run: |
          docker run --rm --network host \
            -v $(pwd)/zap-wrk:/zap/wrk/:rw \
            -w /zap/wrk \
            --user $(id -u):$(id -g) \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://localhost:3000 \
            -r zap-report.html \
            -J zap-report.json \
            -m 0 \
            -z "-config global.homedir=/zap/wrk" \
            -d > zap-debug.log 2>&1
        continue-on-error: true

      # Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install OpenAI Python SDK
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai

      # Analyze scan results using OpenAI API
      - name: Analyze scan results and apply fixes with OpenAI
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Checking for scan report files:"
          ls -lh zap-wrk/zap-report.json zap-wrk/zap-report.html || true
          ls -lh sonar-report.json || true
          
          if [ -f sonar-report.json ] && [ -f zap-wrk/zap-report.json ]; then
            python analyze_results.py
          else
            echo "Missing scan reports. Check SAST/DAST steps."
            cat zap-debug.log || true
            exit 1
          fi
        continue-on-error: true

      # Upload reports and patched files
      - name: Upload scan reports and patched files
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            sonar-report.json
            zap-wrk/zap-report.json
            zap-wrk/zap-report.html
            zap-debug.log
            ai-analysis-report.txt
            patched_files/

      # Cleanup Docker container
      - name: Cleanup
        run: |
          docker stop juice-shop || true
          docker rm juice-shop || true
